name: Skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned for review
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, pinned for review
        with:
          python-version: ${{ matrix.python }}
      - name: Install checker dependency
        run: python -m pip install -r skills/obsidian-vault-health/requirements.txt
      - name: Unit and installation tests
        run: python -m unittest discover -s tests -v
      - name: Skill format and public-file secret patterns
        run: python tools/check_package.py
